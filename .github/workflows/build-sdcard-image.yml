name: Build SD Card Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Raspberry Pi OS Lite (armhf)
        run: |
          echo "Downloading Raspberry Pi OS Lite Bookworm (armhf / 32-bit)..."
          # armhf (32-bit) required for Pi Zero 1W (ARMv6).
          # Pinned to last Bookworm (Debian 12) release — Trixie (Debian 13) became
          # the default in Sept 2025 and is untested with RaceFlag's install.sh.
          wget -q --show-progress \
            "https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2025-05-13/2025-05-13-raspios-bookworm-armhf-lite.img.xz" \
            -O raspios_lite_armhf.img.xz
          echo "Extracting..."
          xz -d raspios_lite_armhf.img.xz
          ls -lh raspios_lite_armhf.img

      - name: Mount image partitions
        run: |
          sudo mkdir -p /mnt/boot /mnt/rootfs
          LOOP=$(sudo losetup -f --show -P raspios_lite_armhf.img)
          echo "LOOP=$LOOP" >> $GITHUB_ENV
          sudo mount ${LOOP}p1 /mnt/boot
          sudo mount ${LOOP}p2 /mnt/rootfs
          echo "Boot partition:"
          ls /mnt/boot/ | head -10
          echo "Root systemd services:"
          ls /mnt/rootfs/etc/systemd/system/ | head -5

      - name: Inject firstrun service
        run: |
          sudo cp sdcard/firstrun/raceflag-firstrun.sh /mnt/rootfs/usr/local/bin/
          sudo chmod +x /mnt/rootfs/usr/local/bin/raceflag-firstrun.sh
          sudo cp sdcard/firstrun/raceflag-firstrun.service /mnt/rootfs/etc/systemd/system/
          sudo ln -sf \
            /etc/systemd/system/raceflag-firstrun.service \
            /mnt/rootfs/etc/systemd/system/multi-user.target.wants/raceflag-firstrun.service
          echo "Injected files:"
          ls -la /mnt/rootfs/usr/local/bin/raceflag-firstrun.sh
          ls -la /mnt/rootfs/etc/systemd/system/raceflag-firstrun.service
          ls -la /mnt/rootfs/etc/systemd/system/multi-user.target.wants/raceflag-firstrun.service

      - name: Unmount image
        if: always()
        run: |
          sudo umount /mnt/boot /mnt/rootfs 2>/dev/null || true
          sudo losetup -d $LOOP 2>/dev/null || true

      - name: Compress image
        run: |
          echo "Compressing (this takes a few minutes)..."
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Fixed filename so os_list.json URL is always stable:
            # https://github.com/.../releases/latest/download/raceflag-sdcard.img.xz
            OUTPUT="raceflag-sdcard.img.xz"
          else
            OUTPUT="raceflag-sdcard-dev.img.xz"
          fi
          xz -T0 -3 raspios_lite_armhf.img
          mv raspios_lite_armhf.img.xz "$OUTPUT"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          ls -lh "$OUTPUT"

      - name: Upload as workflow artifact (manual/dev runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: raceflag-sdcard-image
          path: ${{ env.OUTPUT }}
          retention-days: 7

      - name: Prepare Imager manifest launcher
        if: github.ref_type == 'tag'
        run: cp sdcard/os_list.json raceflag.rpi-imager-manifest

      - name: Attach to GitHub Release (tag runs)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT }}
            raceflag.rpi-imager-manifest
